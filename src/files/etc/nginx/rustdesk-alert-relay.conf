# CortenDesk's own alerts -> rustdesk-notify (alert-relay.php queues them, cortendesk-alerts sends them).
# Local only: CortenDesk posts to http://127.0.0.1:8296/notify/<key> as it would to an Apprise API server.
# Linked into /etc/nginx/http.d (Alpine) or /etc/nginx/sites-enabled (Debian) by `cortendesk-alerts install`.
server {
    listen 127.0.0.1:8296;
    server_name _;
    access_log off;   # the path carries the relay key
    client_max_body_size 64k;

    location ~ "^/notify/[A-Za-z0-9_-]{16,128}/?$" {
        limit_except POST { deny all; }
        fastcgi_pass unix:/run/cortendesk-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/local/lib/cortendesk/alert-relay.php;
        fastcgi_hide_header X-Powered-By;
    }
    location / { return 404; }
}
