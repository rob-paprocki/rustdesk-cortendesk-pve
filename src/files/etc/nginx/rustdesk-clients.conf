# rdgen links served on the console (included in the CortenDesk server block).
#
# Self-update links for Windows clients built by rdgen:
#   /clients/<windows-x86_64|windows-x86>/<RustDesk version the client runs>/<configuration>.exe
# client-update.php redirects to the newest published rdgen build of that configuration with a newer version.
# (quoted: nginx reads "{" in an unquoted regex as the start of the block)
location ~ "^/clients/(windows-x86_64|windows-x86)/([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})/([A-Za-z0-9_-]{1,64})\.exe$" {
    fastcgi_pass unix:/run/cortendesk-fpm.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /usr/local/lib/cortendesk/client-update.php;
    fastcgi_param RD_ARCH $1;
    fastcgi_param RD_VERSION $2;
    fastcgi_param RD_CONFIG $3;
    fastcgi_hide_header X-Powered-By;
}

# Private share links from rdgen's Recent builds page: /share/<token> and /share/<token>/<file> go to rdgen, and
# nothing else of rdgen is reachable here. GET/HEAD only, without the console's cookies. The checked, normalized
# path is what goes upstream ($uri: tokens and file names have no characters that need encoding).
location ~ "^/share/[A-Za-z0-9_-]{43}(/[A-Za-z0-9][A-Za-z0-9._+-]{0,200})?$" {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8000$uri;
    proxy_redirect off;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 120s;
}
